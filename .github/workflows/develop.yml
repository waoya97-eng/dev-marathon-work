name: ssh command
on:
  push:
    branches:
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        # このままだと、エラーで動きません。エラーメッセージを読み、どういった対応が必要なのか確認しよう
      - run: ssh ${{ steps.ssh.outputs.SERVER }} bash /app/na_kondo/deploy.sh na_kondo
