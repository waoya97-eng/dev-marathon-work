name: Production CI/CD

# mainブランチにpushされたら起動する
on:
  push:
    branches:
      - main

jobs:
  # Staging環境でのテスト
  staging-test:
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      - run: ssh -o StrictHostKeyChecking=no ${{ steps.ssh.outputs.SERVER }} "bash /app/na_kondo/deploy.sh na_kondo"

  # Production環境へのデプロイ
  production-deploy:
    needs: staging-test
    runs-on: ubuntu-latest
    steps:
      - id: ssh-prod
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY:  ${{ secrets.DEV_SSH_KEY }}
      # 🛠️ develop.ymlと「全く同じパス」に修正しました！
      - run: ssh -o StrictHostKeyChecking=no ${{ steps.ssh-prod.outputs.SERVER }} "bash /app/na_kondo/deploy.sh na_kondo"
