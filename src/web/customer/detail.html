<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客詳細情報</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">顧客詳細情報</h2>
    <div class="card">
      <div class="card-body">
        <table class="table table-bordered">
          <tr>
            <th>ID</th>
            <td id="customerId">-</td>
          </tr>
          <tr>
            <th>会社名</th>
            <td id="companyName">-</td>
          </tr>
          <tr>
            <th>業種</th>
            <td id="industry">-</td>
          </tr>
          <tr>
            <th>連絡先</th>
            <td id="contact">-</td>
          </tr>
          <tr>
            <th>所在地</th>
            <td id="location">-</td>
          </tr>
          <tr>
            <th>作成日時</th>
            <td id="createdDate">-</td>
          </tr>
          <tr>
            <th>更新日時</th>
            <td id="updatedDate">-</td>
          </tr>
        </table>
        <a id="editBtn" href="#" class="btn btn-warning mr-2">編集</a>
        <button id="deleteBtn" class="btn btn-danger mr-2">削除</button>
        <a href="/customer/list.html" class="btn btn-secondary">一覧に戻る</a>
      </div>
    </div>
  </div>

  <script type="module">
    import config from '../config.js';

    // URLのパラメータから id を取得 (例: detail.html?id=1)
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    if (id) {
      document.getElementById('editBtn').href = `/customer/update.html?id=${id}`;

      fetch(`${config.apiUrl}/customers/${id}`)
        .then(response => {
          if (!response.ok) throw new Error('ネットワークエラー');
          return response.json();
        })
        .then(customer => {
          if (customer) {
            document.getElementById('customerId').textContent = customer.customer_id;
            document.getElementById('companyName').textContent = customer.company_name;
            document.getElementById('industry').textContent = customer.industry;
            document.getElementById('contact').textContent = customer.contact;
            document.getElementById('location').textContent = customer.location;
            document.getElementById('createdDate').textContent = customer.created_date ? new Date(customer.created_date).toLocaleString('ja-JP') : '-';
            document.getElementById('updatedDate').textContent = customer.updated_date ? new Date(customer.updated_date).toLocaleString('ja-JP') : '-';
          } else {
            alert('該当する顧客データが見つかりません。');
          }
        })
        .catch(error => console.error('Error:', error));

      // 削除ボタンのイベントリスナー
      document.getElementById('deleteBtn').addEventListener('click', () => {
        // 「削除していいですか?」の確認
        if (confirm('削除していいですか?')) {
          fetch(`${config.apiUrl}/customers/${id}`, {
            method: 'DELETE'
          })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              alert('削除が完了しました。');
              window.location.href = '/customer/list.html';
            } else {
              alert('削除に失敗しました。');
            }
          })
          .catch(error => {
            console.error('Error:', error);
            alert('削除処理中にエラーが発生しました。');
          });
        }
      });
    } else {
      alert('顧客IDが指定されていません。');
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('editBtn').style.display = 'none';
    }
  </script>
</body>
</html>
