<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer List</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Customer List</h1>
    <table class="table table-striped">
      <thead class="thead-dark">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Company Name</th>
          <th scope="col">Contact</th>
        </tr>
      </thead>
      <tbody id="customer-list">
      </tbody>
    </table>
  </div>

  <script type="module">
    // ExpressサーバのAPIエンドポイントのURL
    import config from "../config.js";

    fetch(`${config.apiUrl}/customers`)
      .then((response) => {
        console.log(response);
        return response.json();
      })
      .then((data) => {
        console.log(data);
        const list = document.getElementById("customer-list");
        list.innerHTML = ""; // 一度中身を空にする

        data.forEach((customer, index) => {
          const row = list.insertRow();
          const cell1 = row.insertCell(0);
          const cell2 = row.insertCell(1);
          const cell3 = row.insertCell(2);

          cell1.textContent = index + 1;

          // 💡 会社名をクリックしたら詳細画面 (detail.html?id=〇〇) に飛ぶリンク
          const link = document.createElement('a');
          // データベースのカラム名に合わせて、そのまま customer.customer_id と customer.company_name を使います
          link.href = `/customer/detail.html?id=${customer.customer_id}`;
          link.textContent = customer.company_name || "名称未設定";
          cell2.appendChild(link);

          cell3.textContent = customer.contact || "-";
        });
      })
      .catch((error) => console.error(error));
  </script>
